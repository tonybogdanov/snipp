    <path
       d="M 14.5 8 V 12.5 A 2 2 0 0 1 12.5 14.5 H 8"
       id="path2-halo" />
    <path
       d="M 5.5 5.5 L 10.5 10.5"
       id="path3-halo" />
  </g>
  <g
     fill="none"
     stroke="#ffffff"
     stroke-width="1"
     stroke-linecap="round"
     stroke-linejoin="round"
     id="g3">
    <!-- top-left crop corner -->
    <path
       d="M 1.5 8 V 3.5 A 2 2 0 0 1 3.5 1.5 H 8"
       id="path1" />
    <!-- bottom-right crop corner -->
    <path
       d="M 14.5 8 V 12.5 A 2 2 0 0 1 12.5 14.5 H 8"
       id="path2" />
    <!-- diagonal, inset 5.5px from each corner -->
    <path
