  <!-- snipp: rounded crop corners with a diagonal slash between them -->
  <!-- 1px black halo: same paths, drawn 2 units wider underneath so exactly
       1 unit of black sits outside the white stroke on every side -->
  <g
     fill="none"
     stroke="#000000"
     stroke-width="3"
     stroke-linecap="round"
     stroke-linejoin="round"
     id="g-halo">
    <path
       d="M 1.5 8 V 3.5 A 2 2 0 0 1 3.5 1.5 H 8"
