name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        shell: pwsh
        run: ./bin/build-windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: snipp-windows
          path: |
            artifacts/snipp.exe
            artifacts/snipp-installer.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: bash bin/build-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: snipp-linux
          path: |
            artifacts/snipp
            artifacts/snipp-installer

  release:
    needs: [build-windows, build-linux]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: snipp-windows
          path: artifacts

      - uses: actions/download-artifact@v7
        with:
          name: snipp-linux
          path: artifacts

      - name: Short sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.sha.outputs.short }}
          name: ${{ steps.sha.outputs.short }}
          make_latest: true
          # Installers only: they carry the app as an embedded payload, and
          # the in-app updater downloads an installer, not a bare binary.
          files: |
            artifacts/snipp-installer.exe
            artifacts/snipp-installer

      # Runs here rather than in the cleanup job below so it can only ever
      # happen after the new release exists, and only on the push that
      # created it.
      - name: Delete every release but this one
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const keep = "${{ steps.sha.outputs.short }}";

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo,
              per_page: 100,
            });

            for (const release of releases) {
              if (release.tag_name === keep) continue;
              try {
                await github.rest.repos.deleteRelease({
                  owner, repo, release_id: release.id,
                });
                // Deleting a release leaves its tag behind, which still
                // shows up in the releases UI as a bare tag.
                await github.rest.git.deleteRef({
                  owner, repo, ref: `tags/${release.tag_name}`,
                });
                console.log(`deleted release and tag ${release.tag_name}`);
              } catch (e) {
                // A concurrent run may have deleted it already, or the tag
                // may be gone while the release wasn't; neither is worth
                // failing the build over.
                console.log(`skipping ${release.tag_name}: ${e.message}`);
              }
            }

  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old runs and artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo,
              workflow_id: "build.yml",
              per_page: 100,
            });
            for (const run of runs) {
              if (run.id === context.runId) continue;
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
              } catch (e) {
                // another concurrent cleanup run may have already deleted
                // it, or it may still be in progress; skip and move on.
                console.log(`skipping run ${run.id}: ${e.message}`);
              }
            }

            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo,
              per_page: 100,
            });
            for (const artifact of artifacts) {
              if (artifact.workflow_run && artifact.workflow_run.id === context.runId) continue;
              try {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              } catch (e) {
                // another concurrent cleanup run may have already deleted it.
                console.log(`skipping artifact ${artifact.id}: ${e.message}`);
              }
            }
