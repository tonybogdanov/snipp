name: Build

on:
  push:
    branches: [master]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        shell: pwsh
        run: ./bin/build-windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: snipp-windows
          path: |
            artifacts/snipp.exe
            artifacts/snipp-installer.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        shell: pwsh
        run: ./bin/build-linux.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: snipp-linux
          path: |
            artifacts/snipp
            artifacts/snipp-installer

  release:
    needs: [build-windows, build-linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: snipp-windows
          path: artifacts

      - uses: actions/download-artifact@v7
        with:
          name: snipp-linux
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          make_latest: true
          files: |
            artifacts/snipp.exe
            artifacts/snipp-installer.exe
            artifacts/snipp
            artifacts/snipp-installer

  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old runs and artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo,
              workflow_id: "build.yml",
              per_page: 100,
            });
            for (const run of runs) {
              if (run.id === context.runId) continue;
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
              } catch (e) {
                // another concurrent cleanup run may have already deleted
                // it, or it may still be in progress; skip and move on.
                console.log(`skipping run ${run.id}: ${e.message}`);
              }
            }

            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo,
              per_page: 100,
            });
            for (const artifact of artifacts) {
              if (artifact.workflow_run && artifact.workflow_run.id === context.runId) continue;
              try {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
              } catch (e) {
                // another concurrent cleanup run may have already deleted it.
                console.log(`skipping artifact ${artifact.id}: ${e.message}`);
              }
            }
