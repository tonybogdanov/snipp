name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        shell: pwsh
        run: ./bin/build-windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: snipp-windows
          path: artifacts/snipp.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        shell: pwsh
        run: ./bin/build-linux.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: snipp-linux
          path: artifacts/snipp

  cleanup:
    needs: [build-windows, build-linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete old runs and artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo,
              workflow_id: "build.yml",
              per_page: 100,
            });
            for (const run of runs) {
              if (run.id === context.runId) continue;
              await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
            }

            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner, repo,
              per_page: 100,
            });
            for (const artifact of artifacts) {
              if (artifact.workflow_run && artifact.workflow_run.id === context.runId) continue;
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id });
            }
